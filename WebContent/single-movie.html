<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Single Movie</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/single-movie.css">
</head>
<body>
<!-- Navbar -->
<header class="main-navbar">
    <div class="navbar-content">
        <a href="main.html" class="logo">2Shows</a>
    </div>
    <form class="navbar-search" action="movie-list.html" method="GET">
        <div style="position:relative; display:flex; gap:6px; width:100%;">
            <input type="search"
                   id="navbar-search-input"
                   name="fulltext"
                   placeholder="Search movies…"
                   autocomplete="off">
            <button type="button" id="navbar-search-button">Search</button>
            <ul id="navbar-autocomplete-dropdown" class="autocomplete-dropdown" hidden></ul>
        </div>
    </form>
    <nav class="navbar-links">
        <a href="movie-list.html">Movies</a>
        <a href="login.html" class="login-link" hidden>Log In</a>
        <a href="profile.html" class="profile-link" hidden>Profile</a>
        <a href="api/logout" class="logout-link" hidden>Logout</a>
    </nav>
</header>

<main class="movie-container">
    <a href="movie-list.html" id="back-to-movie-list" class="back-button">← Back to Movie List</a>
    <div class="movie-layout">
        <div class="movie-poster">
            <img id="movie_poster_image" alt="" hidden>
            <span id="movie_poster_placeholder" class="poster-placeholder" hidden>No poster available</span>
            <button id="favorite-button" class="favorite-button" hidden>☆ Add to Favorites</button>
            <div id="watch-status-buttons" class="watch-status-buttons" hidden>
                <button class="watch-status-button watched" data-status="watched">Watched</button>
                <button class="watch-status-button watching" data-status="watching">Watching</button>
                <button class="watch-status-button plan-to-watch" data-status="plan_to_watch">Plan to Watch</button>
            </div>
        </div>
        <div class="movie-content">
            <header class="movie-header">
                <h1 id="movie_title"></h1>
                <div class="movie-meta">
                    <span id="movie_year"></span>
                    <span class="rating-badge"> * <span id="movie_rating"></span></span>
                </div>
            </header>
            <section class="movie-info">
                <p><strong>Director:</strong> <span id="movie_director"></span></p>
                <div class="genre-list">
                    <strong>Genres:</strong>
                    <div id="movie_genres"></div>
                </div>
                <div class="star-list">
                    <strong>Stars:</strong>
                    <ul id="movie_stars"></ul>
                </div>
            </section>
        </div>
    </div>
    <section class="movie-overview">
        <h2>Overview</h2>
        <p id="movie_overview"></p>
    </section>
</main>

<!-- Load jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="js/single-movie.js"></script>
<script src="js/navbar-search.js"></script>
<script src="js/navbar-auth.js"></script>
</body>
</html>
